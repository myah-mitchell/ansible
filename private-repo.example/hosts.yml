all:
  vars:
    # provision.yml's identity values, fleet-wide. A group or host can set its
    # own, and anything set nowhere is asked for when the run starts. A value
    # passed with -e (or in a Semaphore Variable Group's Extra Variables) wins
    # over all of these, so keep them out of there if any host overrides one.
    short_name: "EXAMPLE"
    abbr_name: "ex"
    location_abbr: "h"
    domain_name: "example.com"
    # server_password belongs in a secret, not here. Unset, it is asked for,
    # or taken as empty under Semaphore, which leaves passwords as they are.

localhosts:
  hosts:
    ubuntu:
      ansible_host: 127.0.0.1

      ntp_service: "chrony"

      FIREWALL: true
      firewall_service: "ufw"

      SWAP: true
      swap_size: "512M"
      swap_file: "/swapfile"

      AUTOUPDATE: true
      NODE_EXPORTER: true

    ubuntu_docker:
      ansible_host: 127.0.0.1

      ntp_service: "chrony"

      FIREWALL: true
      firewall_service: "ufw"

      SWAP: true
      swap_size: "512M"
      swap_file: "/swapfile"

      AUTOUPDATE: true
      DOCKER: true
      KOMODO: true
      NODE_EXPORTER: true

    wsl:
      ansible_host: 127.0.0.1

      AUDITD: false
      AUTOUPDATE: false
      DOCKER: false
      FAIL2BAN: false
      FIREWALL: false
      HOSTNAME: false
      LOGGING: false
      MAIL: false
      MONITORING: false
      NGINX: false
      NTP: false
      QEMU: false
      SSH: false
      SWAP: false
      USERS: true
      users_ansible_setup: false
      users_admin_setup: false
      users_root_setup: false
      VRRP: false

docker_host:
  hosts:
    # Each docker_stacks list is what the host runs once the site is finished.
    # komodo-sync.yml turns these lists into komodo/stacks/<host>.toml, which
    # Komodo's Resource Sync reads, so run it and commit its output after any
    # change here. While the fleet is still being built, set
    # docker_stacks_bootstrap: true on a host: the stacks role then leaves out
    # system-agent and traefik-agent, and prepares traefik-bootstrap in place
    # of the Traefik the host would have had. Remove it at the handover, and run
    # komodo-sync.yml again.
    km01:
      ansible_host: 172.16.1.101
      serverHostname: "km01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - komodo-server
    tf01:
      ansible_host: 172.16.1.102
      serverHostname: "tf01"
      docker_stacks:
        - system-agent
        - traefik-server
    ci01:
      ansible_host: 172.16.1.103
      serverHostname: "ci01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - semaphore-server
        - victoriametrics-server
        - core-infra
    id01:
      ansible_host: 172.16.1.104
      serverHostname: "id01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - authentik-server
    pk01:
      ansible_host: 172.16.1.105
      serverHostname: "pk01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - step-ca-server
    bh01:
      ansible_host: 172.16.2.101
      serverHostname: "bh01"
      docker_stacks:
        - system-agent
        - traefik-dmz
    mx01:
      ansible_host: 172.16.2.102
      serverHostname: "mx01"
      docker_stacks:
        - system-agent
        - traefik-agent
        - stalwart-server
    # A host with a VM in opentofu/prod.tfvars, under its serverHostname, is
    # one site.yml creates: the first run that targets it clones the VM through
    # OpenTofu, provisions it, and deploys its stacks through Komodo. The hosts
    # above have no VM there in this example, so OpenTofu never touches them.
    # The fleet bootstrap docs give every host one. The VM's address there must
    # match ansible_host.
    ex01:
      ansible_host: 172.16.1.110
      serverHostname: "ex01"
      docker_stacks:
        - system-agent
        - traefik-agent
  vars:
    docker_stacks_internal_subnet: "172.16.1.0/24"

    ntp_service: "chrony"

    FIREWALL: true
    firewall_service: "ufw"

    SWAP: true
    swap_size: "512M"
    swap_file: "/swapfile"

    AUTOUPDATE: true
    DOCKER: true
    KOMODO: true
    NODE_EXPORTER: true

pbs_host:
  hosts:
    bk01:
      ansible_host: 127.0.0.1
      serverHostname: "bk01"

      NTP: true
      ntp_service: "chrony"

      PBS: true
      pbs_enterprise_repo: false
      pbs_interface_primary: "nic0"
      pbs_interface_secondary: ""

      NGINX: true

pmg_host:
  hosts:
    pmg01:
      ansible_host: 127.0.0.1
      serverHostname: "pmg01"

      NTP: true
      ntp_service: "chrony"

      PMG: true
      pmg_enterprise_repo: false
      pmg_interface_primary: "ens18"
      pmg_interface_secondary: ""

      NGINX: true

pve_host:
  hosts:
    # Nodes of one Proxmox cluster share a pve_cluster_name; a standalone
    # server, like this one, leaves it unset. The first node of each cluster in
    # this file builds the cloud-init template, and must be that server's
    # template_node in opentofu/prod.tfvars.
    vh01:
      ansible_host: 172.16.0.11
      serverHostname: "vh01"
      pve_interfaces:
        mgmt:
          ip: "172.16.0.11"
          cidr: "24"
          gw: "172.16.0.1"

  vars:
    NTP: true
    ntp_service: "chrony"

    PVE: true
    pve_enterprise_repo: false

    pve_interface_names:
      mgmt:
        primary: "enp26s0f0np0"

    NGINX: true
