all:
localhosts:
  hosts:
    ubuntu:
      ansible_host: 127.0.0.1

      ntp_service: "chrony"

      FIREWALL: true
      firewall_service: "ufw"

      SWAP: true
      swap_size: "512M"
      swap_file: "/swapfile"

      AUTOUPDATE: true
      NODE_EXPORTER: true

    ubuntu_docker:
      ansible_host: 127.0.0.1

      ntp_service: "chrony"

      FIREWALL: true
      firewall_service: "ufw"

      SWAP: true
      swap_size: "512M"
      swap_file: "/swapfile"

      AUTOUPDATE: true
      DOCKER: true
      KOMODO: true
      NODE_EXPORTER: true

    wsl:
      ansible_host: 127.0.0.1

      AUDITD: false
      AUTOUPDATE: false
      DOCKER: false
      FAIL2BAN: false
      FIREWALL: false
      HOSTNAME: false
      LOGGING: false
      MAIL: false
      MONITORING: false
      NGINX: false
      NTP: false
      QEMU: false
      SSH: false
      SWAP: false
      USERS: true
      users_ansible_setup: false
      users_admin_setup: false
      users_root_setup: false
      VRRP: false

docker_host:
  hosts:
    km01:
      ansible_host: 172.16.1.101
      serverHostname: "km01"
      docker_stacks:
        - komodo-server
    tf01:
      ansible_host: 172.16.1.102
      serverHostname: "tf01"
      docker_stacks:
        - traefik-server
    ci01:
      ansible_host: 172.16.1.103
      serverHostname: "ci01"
      docker_stacks:
        - traefik-bootstrap
        - semaphore-server
        - victoriametrics-server
        - core-infra
    id01:
      ansible_host: 172.16.1.104
      serverHostname: "id01"
      docker_stacks:
        - traefik-bootstrap
        - authentik-server
    pk01:
      ansible_host: 172.16.1.105
      serverHostname: "pk01"
      docker_stacks:
        - traefik-bootstrap
        - step-ca-server
    bh01:
      ansible_host: 172.16.2.101
      serverHostname: "bh01"
      docker_stacks:
        - traefik-dmz
    mx01:
      ansible_host: 172.16.2.1021
      serverHostname: "mx01"
      docker_stacks:
        - stalwart-server
  vars:
    docker_stacks_internal_subnet: "172.16.1.0/24"

    ntp_service: "chrony"

    FIREWALL: true
    firewall_service: "ufw"

    SWAP: true
    swap_size: "512M"
    swap_file: "/swapfile"

    AUTOUPDATE: true
    DOCKER: true
    KOMODO: true
    NODE_EXPORTER: true

pbs_host:
  hosts:
    bk01:
      ansible_host: 127.0.0.1
      serverHostname: "bk01"

      NTP: true
      ntp_service: "chrony"

      PBS: true
      pbs_enterprise_repo: false
      pbs_interface_primary: "nic0"
      pbs_interface_secondary: ""

      NGINX: true

pmg_host:
  hosts:
    pmg01:
      ansible_host: 127.0.0.1
      serverHostname: "pmg01"

      NTP: true
      ntp_service: "chrony"

      PMG: true
      pmg_enterprise_repo: false
      pmg_interface_primary: "ens18"
      pmg_interface_secondary: ""

      NGINX: true

pve_host:
  hosts:
    vh01:
      ansible_host: 172.16.0.11
      serverHostname: "vh01"
      pve_interfaces:
        mgmt:
          ip: "172.16.0.11"
          cidr: "24"
          gw: "172.16.0.1"

  vars:
    NTP: true
    ntp_service: "chrony"

    PVE: true
    pve_enterprise_repo: false

    pve_interface_names:
      mgmt:
        primary: "enp26s0f0np0"

    NGINX: true