---
- name: Normalize the stack list
  ansible.builtin.set_fact:
    docker_stacks_list: >-
      {{ (docker_stacks.split(',') if docker_stacks is string else docker_stacks)
         | map('trim') | reject('equalto', '') | unique | list }}

- name: Clone/update docker-stacks on the control node
  ansible.builtin.git:
    repo: "{{ docker_stacks_repo_url }}"
    dest: "{{ docker_stacks_local_checkout }}"
    version: "{{ docker_stacks_repo_version }}"
    depth: 1
  delegate_to: localhost
  become: false
  run_once: true

# scripts/build.py writes stacks/<name>/setup.yaml from the setup.yaml of every
# container the stack uses, following include and keeping only the entries for
# the service variants the stack runs. CI fails when that output is not
# committed, so the file on main is trusted here.
- name: Check each stack has a generated setup file
  ansible.builtin.assert:
    that: stack_setup_path is file
    fail_msg: >-
      {{ stack_setup_path }} is missing. Check the stack name, or run
      scripts/build.py in docker-stacks and commit its output.
    quiet: true
  vars:
    stack_setup_path: "{{ docker_stacks_local_checkout }}/stacks/{{ item }}/setup.yaml"
  loop: "{{ docker_stacks_list }}"

- name: Read each stack's setup file
  ansible.builtin.set_fact:
    docker_stacks_setup: >-
      {{ docker_stacks_setup | default([])
         + [{'stack': item,
             'project': stack_setup.project | default('', true),
             'folders': stack_setup.folders | default([], true),
             'files': stack_setup.files | default([], true),
             'firewall': stack_setup.firewall | default([], true)}] }}
  vars:
    stack_setup: "{{ lookup('ansible.builtin.file', docker_stacks_local_checkout ~ '/stacks/' ~ item ~ '/setup.yaml') | from_yaml }}"
  loop: "{{ docker_stacks_list }}"

- name: Check every stack has a project name
  ansible.builtin.assert:
    that: item.project | length > 0
    fail_msg: 'stacks/{{ item.stack }}/compose.yaml has no # Project Name: "<name>" line.'
    quiet: true
  loop: "{{ docker_stacks_setup }}"
  loop_control:
    label: "{{ item.stack }}"

- name: Check the internal subnet is set when a rule needs it
  ansible.builtin.assert:
    that: docker_stacks_internal_subnet | length > 0
    fail_msg: >-
      A stack in {{ docker_stacks_list | join(', ') }} opens a port to the
      internal subnet. Set docker_stacks_internal_subnet to it in CIDR form.
    quiet: true
  when:
    - FIREWALL|bool
    - docker_stacks_setup | map(attribute='firewall') | flatten | selectattr('allow_from', 'equalto', 'internal') | list | length > 0

- name: Create the shared logs and volumes folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_stacks_folder_owner }}"
  loop:
    - "{{ docker_stacks_logs_dir }}"
    - "{{ docker_stacks_volumes_dir }}"

# Several stacks can share a project, such as the traefik ones, so each
# project's folders are created once.
- name: Create each project's own logs and volumes folders
  ansible.builtin.file:
    path: "{{ item.1 }}/{{ item.0 }}"
    state: directory
    owner: "{{ docker_stacks_folder_owner }}"
    group: "{{ docker_stacks_folder_group }}"
    mode: "0750"
  loop: "{{ docker_stacks_setup | map(attribute='project') | unique | product([docker_stacks_logs_dir, docker_stacks_volumes_dir]) | list }}"
  loop_control:
    label: "{{ item.1 }}/{{ item.0 }}"

# Never recursive: these folders may already hold a container's data, and only
# the folder itself is set.
- name: Create each container's folders
  ansible.builtin.file:
    path: "{{ docker_stacks_logs_dir if item.1.root == 'logs' else docker_stacks_volumes_dir }}/{{ item.0.project }}/{{ item.1.path }}"
    state: directory
    owner: "{{ item.1.owner }}"
    group: "{{ item.1.group }}"
    mode: "{{ item.1.mode | default(omit) }}"
  loop: "{{ docker_stacks_setup | subelements('folders') }}"
  loop_control:
    label: "{{ item.1.root }}/{{ item.0.project }}/{{ item.1.path }}"

# force: false leaves a file that is already there alone, so a filled-in copy
# such as mailrise.conf with its real token is never replaced by the example.
- name: Seed each container's config files that are not there yet
  ansible.builtin.copy:
    src: "{{ docker_stacks_local_checkout }}/{{ item.1.source }}"
    dest: "{{ docker_stacks_volumes_dir }}/{{ item.0.project }}/{{ item.1.path }}"
    owner: "{{ item.1.owner }}"
    group: "{{ item.1.group }}"
    mode: "{{ item.1.mode | default(omit) }}"
    force: false
  loop: "{{ docker_stacks_setup | subelements('files') }}"
  loop_control:
    label: "{{ item.0.project }}/{{ item.1.path }}"

- name: Open each container's firewall ports
  community.general.ufw:
    rule: allow
    port: "{{ item.1.port | string }}"
    proto: "{{ item.1.proto }}"
    from_ip: "{{ docker_stacks_internal_subnet if item.1.allow_from == 'internal' else 'any' }}"
    comment: "{{ item.1.comment }}"
  loop: "{{ docker_stacks_setup | subelements('firewall') }}"
  loop_control:
    label: "{{ item.0.stack }}: {{ item.1.comment }} ({{ item.1.port }}/{{ item.1.proto }})"
  when: FIREWALL|bool and firewall_service == "ufw"
