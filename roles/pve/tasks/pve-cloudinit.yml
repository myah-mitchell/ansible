---
# The vendor snippet goes on every node: it sits on each node's own `local`
# storage, and a clone migrated to another node reads it there. The template
# is built on one node per cluster, the first PVE host in inventory order that
# shares its pve_cluster_name. A standalone server, with none set, builds its
# own. The vms role clones from the same host, so the two must agree.
- block:

  - name: Check for Snippets Folder
    ansible.builtin.stat:
      path: /var/lib/vz/snippets/
    register: _snippets_folder

  - name: Create Snippets Folder
    ansible.builtin.command:
      cmd: pvesm set local --content iso,backup,vztmpl,snippets
    when: not _snippets_folder.stat.exists

  - name: Install cloudinit-vendor.yml
    ansible.builtin.template:
      src: cloudinit-vendor.yml.j2
      dest: /var/lib/vz/snippets/cloudinit-vendor.yml
      trim_blocks: true
      lstrip_blocks: true

  - name: Find this cluster's template host
    ansible.builtin.set_fact:
      _pve_template_host: >-
        {%- for h in groups['all']
              if (hostvars[h].PVE | default(false) | bool)
              and (hostvars[h].pve_cluster_name | default(h)) == (pve_cluster_name | default(inventory_hostname)) -%}
          {%- if loop.first %}{{ h }}{% endif -%}
        {%- endfor -%}

  - name: Build the template on the cluster's template host
    when: inventory_hostname == _pve_template_host
    block:
      - name: Install create-cloud-init-template.sh
        ansible.builtin.template:
          src: create-cloud-init-template.sh.j2
          dest: /usr/local/bin/create-cloud-init-template.sh
          trim_blocks: true
          lstrip_blocks: true
          mode: '0550'
        vars:
          _pve_vm_storage: "local-zfs"
          _pve_fs_storage: "local"

      - name: Create Cron Job to Recreate Ubuntu Template Every Week
        ansible.builtin.cron:
          name: Recreate Cloud-Init Template
          minute: "0"
          hour: "20"
          weekday: "3"
          job: "/usr/local/bin/create-cloud-init-template.sh > /dev/null"

  tags:
    - pve-cloudinit
