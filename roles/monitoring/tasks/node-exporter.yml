---
# node_exporter ships as a single static binary, so the version already on disk
# is the only thing that decides whether a download is needed. Without this the
# tarball is fetched and extracted on every run, then deleted again by the
# cleanup below, so no run ever reports changed=0.
- name: Check which Node Exporter version is installed
  ansible.builtin.command:
    cmd: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  failed_when: false
  changed_when: false

# Different releases have printed the version banner to stdout and to stderr, so
# both are searched. An unreadable or missing binary leaves both empty and the
# install goes ahead, which is the safe direction to fail in.
- name: Decide whether Node Exporter needs installing
  ansible.builtin.set_fact:
    _node_exporter_needs_install: >-
      {{ not ((node_exporter_installed.stdout | default('')) ~ (node_exporter_installed.stderr | default('')))
         is search('version ' ~ (node_exporter_version | regex_escape) ~ ' ') }}

- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    mode: '0644'
  when: _node_exporter_needs_install

- name: Extract Node Exporter archive
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: _node_exporter_needs_install

- name: Copy Node Exporter binary to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  when: _node_exporter_needs_install
  notify: restart node_exporter

- name: Remove Node Exporter download artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
  when: _node_exporter_needs_install

- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /bin/false
    create_home: false

# Created after the user exists so it can be owned correctly on the first pass.
# Creating it as root and correcting the owner further down made both tasks
# report changed on every run, each undoing the other.
- name: Create node-exporter config directory
  ansible.builtin.file:
    path: /etc/node-exporter
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: '0775'

- name: Generate Node Exporter TLS private key
  community.crypto.openssl_privatekey:
    path: /etc/node-exporter/node_exporter.key
    size: 2048
    owner: node_exporter
    group: node_exporter
    mode: '0400'

- name: Generate Node Exporter TLS CSR
  community.crypto.openssl_csr:
    path: /etc/node-exporter/node_exporter.csr
    privatekey_path: /etc/node-exporter/node_exporter.key
    country_name: "{{ node_exporter_tls_country }}"
    state_or_province_name: "{{ node_exporter_tls_state }}"
    locality_name: "{{ node_exporter_tls_city }}"
    organization_name: "{{ node_exporter_tls_org }}"
    common_name: node-exporter
    subject_alt_name:
      - "DNS:{{ ansible_facts.fqdn }}"
    owner: node_exporter
    group: node_exporter
    mode: '0644'

- name: Generate Node Exporter self-signed certificate
  community.crypto.x509_certificate:
    path: /etc/node-exporter/node_exporter.crt
    privatekey_path: /etc/node-exporter/node_exporter.key
    csr_path: /etc/node-exporter/node_exporter.csr
    provider: selfsigned
    selfsigned_not_after: "+3650d"
    owner: node_exporter
    group: node_exporter
    mode: '0644'

- name: Set restricted permissions on node-exporter private key
  ansible.builtin.file:
    path: /etc/node-exporter/node_exporter.key
    mode: '0400'

# Each host gets its own basic-auth password. A host's vmagent only ever scrapes
# that same host's node_exporter, over its own address, so the password never has
# to match between hosts and there is nothing to share. Generating it here keeps
# it off every inventory file and out of Komodo entirely.
#
# The plaintext is kept on the host so later runs reuse it rather than minting a
# new one and restarting node_exporter every time.

- name: Look for an existing node_exporter password on this host
  ansible.builtin.slurp:
    src: /etc/node-exporter/password
  register: node_exporter_password_existing
  failed_when: false
  no_log: true

- name: Decide this host's node_exporter password
  ansible.builtin.set_fact:
    _node_exporter_password: >-
      {{
        node_exporter_password if node_exporter_password | length > 0
        else (
          node_exporter_password_existing.content | b64decode | trim
          if node_exporter_password_existing.content is defined
          else lookup('ansible.builtin.password', '/dev/null', length=40,
                      chars=['ascii_letters', 'digits'])
        )
      }}
  no_log: true

- name: Store this host's node_exporter password
  ansible.builtin.copy:
    content: "{{ _node_exporter_password }}"
    dest: /etc/node-exporter/password
    owner: node_exporter
    group: node_exporter
    mode: '0600'
  register: node_exporter_password_stored
  no_log: true

# The container reading this runs under Docker's remapped user namespace, so the
# UID that owns the file is the host-side translation of the container's own.
- name: Publish the node_exporter password for this host's vmagent
  ansible.builtin.copy:
    content: "{{ _node_exporter_password }}"
    dest: /etc/node-exporter/scrape-password
    owner: "{{ node_exporter_scrape_uid }}"
    group: "{{ node_exporter_scrape_gid }}"
    mode: '0400'
  no_log: true

# bcrypt salts every hash, so hashing on every run would rewrite config.yml and
# restart node_exporter each time. Hash only when the password actually changed,
# and keep the result so later runs can write the same config.
#
# The hashing happens here on the target rather than through password_hash on the
# controller. That filter needs passlib, and the controller is Semaphore's own
# container, which has neither passlib nor a bcrypt backend and is a stock image
# with no build step to add one. htpasswd is a two-hundred-kilobyte package on a
# host this role already manages, and it keeps working across Semaphore upgrades.
- name: Install htpasswd, which hashes this host's node_exporter password
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check for a stored node_exporter password hash
  ansible.builtin.stat:
    path: /etc/node-exporter/password.bcrypt
  register: node_exporter_hash_file

# -i reads the password from stdin so it never appears in the process list, -n
# prints the result instead of writing a file, and -B selects bcrypt. htpasswd
# prints username:hash, and the username here is empty, so everything ahead of
# the hash's own leading $ is dropped.
- name: Hash this host's node_exporter password
  ansible.builtin.command:
    cmd: htpasswd -inBC 12 ""
    stdin: "{{ _node_exporter_password }}"
  register: node_exporter_hash_generated
  when: node_exporter_password_stored.changed or not node_exporter_hash_file.stat.exists
  changed_when: false
  no_log: true

# A malformed hash here would be written to config.yml and lock out every scrape
# with a 401 that looks like a wrong password rather than a broken hash, so it is
# worth failing on the spot instead.
- name: Check the generated hash is bcrypt
  ansible.builtin.assert:
    that:
      - _node_exporter_generated_hash is match('^\$2[aby]\$[0-9]{2}\$.{53}$')
    fail_msg: htpasswd did not return a bcrypt hash. Check that apache2-utils is installed and supports -B.
    quiet: true
  vars:
    _node_exporter_generated_hash: "{{ node_exporter_hash_generated.stdout | default('') | trim | regex_replace('^[^$]*', '') }}"
  when: not node_exporter_hash_generated is skipped

- name: Store this host's node_exporter password hash
  ansible.builtin.copy:
    content: "{{ node_exporter_hash_generated.stdout | trim | regex_replace('^[^$]*', '') }}"
    dest: /etc/node-exporter/password.bcrypt
    owner: node_exporter
    group: node_exporter
    mode: '0600'
  when: not node_exporter_hash_generated is skipped
  no_log: true

- name: Read this host's stored node_exporter password hash
  ansible.builtin.slurp:
    src: /etc/node-exporter/password.bcrypt
  register: node_exporter_hash_stored
  no_log: true

- name: Create Node Exporter config
  ansible.builtin.copy:
    dest: /etc/node-exporter/config.yml
    owner: node_exporter
    group: node_exporter
    mode: '0644'
    content: |
      tls_server_config:
        cert_file: /etc/node-exporter/node_exporter.crt
        key_file: /etc/node-exporter/node_exporter.key
      basic_auth_users:
        node-exporter-user: "{{ node_exporter_hash_stored.content | b64decode | trim }}"
  notify: restart node_exporter
  no_log: true

- name: Create Node Exporter systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Node Exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter --web.config.file=/etc/node-exporter/config.yml
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
  notify: restart node_exporter

- name: Enable and start Node Exporter service
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true

- name: Create Node Exporter UFW application config
  ansible.builtin.copy:
    dest: /etc/ufw/applications.d/node-exporter
    owner: root
    group: root
    mode: '0644'
    content: |
      [Node-Exporter]
      title=Node-Exporter
      description=Allows incoming traffic for Node-Exporter on port 9100
      ports=9100/tcp
  register: node_exporter_ufw_config

- name: Update UFW Node-Exporter application
  ansible.builtin.command:
    cmd: ufw app update Node-Exporter
  when: node_exporter_ufw_config.changed
  changed_when: true

- name: Allow Node-Exporter through UFW
  community.general.ufw:
    rule: allow
    name: Node-Exporter
