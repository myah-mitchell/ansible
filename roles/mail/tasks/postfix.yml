---
### Package Management
- name: Install Packages
  ansible.builtin.apt:
    name:
      - postfix
    state: present
    update_cache: false
  retries: 3
  delay: 5

### Configure Postfix and Mail
- name: Update Postfix MyHostname
  lineinfile:
    dest: /etc/postfix/main.cf
    regexp: "^myhostname.*"
    line: "myhostname = {{ server_fqdn }}"
    state: present
  notify: restart postfix

- name: Update Postfix MyDestination
  lineinfile:
    dest: /etc/postfix/main.cf
    regexp: "^mydestination.*"
    line: "mydestination = {{ server_fqdn }}, localhost.{{ location_domain_name }}, localhost.{{ domain_name }}, localhost"
    state: present
  notify: restart postfix

- name: Update Postfix SMTP Banner
  lineinfile:
    dest: /etc/postfix/main.cf
    regexp: "^smtpd_banner .*"
    line: "smtpd_banner = $myhostname ESMTP"
    state: present
  notify: restart postfix

# Postfix here only sends the host's own mail (cron, unattended-upgrades), which
# goes through the sendmail command and needs no listener. Docker hosts publish
# port 25 from containers, such as core-infra's Postfix on ci01 and Stalwart on
# mx01, so the host must not be listening on it too.
- name: Disable Postfix SMTP Listener
  lineinfile:
    dest: /etc/postfix/main.cf
    regexp: "^master_service_disable.*"
    line: "master_service_disable = inet"
    state: present
  notify: restart postfix

- name: Update Root Email
  lineinfile:
    dest: /etc/aliases
    regexp: "^root:.*"
    line: "root:{{ admin_list }}"
    state: present
  notify: newaliases

