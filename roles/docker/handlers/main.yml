---
- name: restart docker
  service:
    name: docker
    state: restarted

- name: reload docker
  service:
    name: docker
    state: reloaded

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart ssh for host keys
  ansible.builtin.service:
    name: ssh
    state: restarted
