---
#### DOCKER role installs and configures docker
DOCKER: false

# Shared network every docker-stacks compose.yaml attaches to as external: true.
# Compose never creates an external network, so it has to exist before a host's
# first deploy. Must match GLOBAL_PROXY_NETWORK in Komodo.
docker_proxy_network: proxy

# The two extra disks a Docker host carries. Proxmox presents them as scsi1 and
# scsi2, and the by-id path follows that slot rather than the order the kernel
# finds the disks in, which /dev/sdb would not. Check the names on a real VM
# with ls -l /dev/disk/by-id and change these if they differ.
#
# scsi1 is /var/lib/docker: images and layers, thrown away with the VM.
# scsi2 is the persistent disk: everything worth keeping from the VM, and the
# one disk a rebuilt VM takes over from the VM it replaces.
#
# Each disk gets an ext4 filesystem directly, with no LVM and no partition
# table, and is mounted by label. Grow one with qm resize on the Proxmox host
# and then resize2fs on the device here. An existing filesystem is never
# reformatted, which is what lets a moved disk keep its data.
docker_root_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
docker_root_label: docker-root
docker_persist_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2
docker_persist_label: persist

# The persistent disk is mounted here and split into two folders:
#   volumes/  every stack's state, bind mounted onto docker_volumes_mount
#   logs/     the log files stacks write, bind mounted onto docker_logs_mount
#   host/     what makes this host itself: its SSH host keys and Periphery's key
# The split keeps host secrets out of the per-project folders, and keeps the
# filesystem's lost+found out of the volumes and logs folders.
docker_persist_mount: /srv/persist

# Must match docker_stacks_volumes_dir in the stacks role and
# GLOBAL_DOCKER_VOLUMES in Komodo.
docker_volumes_mount: /opt/docker/volumes

# Must match docker_stacks_logs_dir in the stacks role and GLOBAL_DOCKER_LOGS in
# Komodo.
docker_logs_mount: /opt/docker/logs

# The suite of Docker's apt repo to install from. It follows the host's own
# release, so a VM built from a newer template gets that release's packages
# with no edit here. Docker's repo can trail a brand-new Ubuntu release by
# weeks. If a new template's first boot fails at the Docker install for that
# reason, pin this to the previous release's codename (for example "resolute")
# in ansible-private's group_vars/all/private.yml until the suite appears.
ubuntu_release: "{{ ansible_facts.distribution_release }}"
container_count: 4
default_container_name: docker
default_container_image: ubuntu
default_container_command: sleep 1d

#### KOMODO periphery agent (requires DOCKER: true)
KOMODO: false

komodo_root_directory: "/opt/docker"

# PKI auth. Periphery runs in outbound mode - it dials out to Core, so
# there's no inbound port/UFW rule needed on any host.
#
# komodo_core_address: Core's real address, e.g. "https://<km01-ip>:9120"
# during bootstrap (DNS/Traefik don't exist yet for most of the fleet), or
# its real hostname once they do.
komodo_core_address: ""

# Core's own public key - not secret, safe to commit for real once known.
# Extract it from km01's running Core and commit the real value here - see
# docs/komodo-bootstrap.md in docker-stacks.
komodo_core_public_key: ""

# Left blank by default. Only pass a real value via `-e` at the CLI when
# provisioning a brand-new host - generate it fresh in Komodo's UI/API right
# before the run, never commit a real value here. It's single-use and
# discarded by Komodo after the first successful connect.
komodo_onboarding_key: ""

# The Server resource name/id this Periphery should connect as in Core.
# Deliberately NOT "{{ short_name }}": that's the organization's short
# name, constant fleet-wide (same value pve_cluster_clustername,
# ssh_legal_banner_name, and every pve/pmg/pbs TLS cert's
# organization_name already key off) - it was never meant to identify
# one specific host. serverHostname is this repo's own established
# answer to "this host's real name" (see roles/provision/tasks/main.yml,
# and every pve/pmg/pbs TLS cert's subject_alt_name) - it falls back to
# the live ansible_facts.hostname when no inventory host_var pins it.
komodo_connect_as: "{{ serverHostname|lower }}"

# Periphery's private key, on the persistent disk. Left at its own default it
# would sit in /opt/docker/keys on the OS disk, and a rebuilt VM would have to
# be onboarded again as a brand-new host. Kept on the disk that moves with the
# host's data, the rebuilt VM presents the same identity and Core sees a
# reconnect. Periphery writes a key here on its first start when there is none.
komodo_private_key_dir: "{{ docker_persist_mount }}/host/komodo"
