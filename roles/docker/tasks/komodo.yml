---
- name: Install acl package (required for become_user komodo, an unprivileged user)
  ansible.builtin.apt:
    name: acl
    state: present

- name: Create komodo user
  ansible.builtin.user:
    name: komodo
    group: docker
    shell: /bin/bash
    create_home: true

- name: Set komodo subuid
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: '^komodo:'
    line: 'komodo:100000:65536'
    create: true

- name: Set komodo subgid
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: '^komodo:'
    line: 'komodo:100000:65536'
    create: true

- name: Add Komodo env vars to komodo bashrc
  ansible.builtin.blockinfile:
    path: /home/komodo/.bashrc
    block: |
      export XDG_RUNTIME_DIR="/run/user/$(id -u $USER)"
      export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Komodo env"

- name: Enable linger for komodo user
  ansible.builtin.command:
    cmd: loginctl enable-linger komodo
    creates: /var/lib/systemd/linger/komodo

- name: Create Komodo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /opt/docker/builds
    - /opt/docker/repos
    - /opt/docker/ssl
    - /opt/docker/stacks

- name: Set ownership on /opt/docker and stacks
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ admin_name }}"
    group: docker
    mode: '0775'
  loop:
    - /opt/docker
    - /opt/docker/stacks

- name: Set ownership on Komodo managed directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: komodo
    group: docker
    recurse: true
  loop:
    - /opt/docker/builds
    - /opt/docker/repos
    - /opt/docker/ssl

- name: Set Komodo ssl directory to root group with restricted permissions
  ansible.builtin.file:
    path: /opt/docker/ssl
    owner: komodo
    group: root
    mode: '0700'

- name: Set komodo home directory permissions
  ansible.builtin.file:
    path: /home/komodo
    mode: '0700'

- name: Get komodo user info
  ansible.builtin.getent:
    database: passwd
    key: komodo

- name: Ensure komodo runtime directory exists
  ansible.builtin.file:
    path: "/run/user/{{ ansible_facts.getent_passwd['komodo'][1] }}"
    state: directory
    owner: komodo
    group: docker
    mode: '0700'

- name: Ensure komodo remote_tmp directory exists with correct permissions
  ansible.builtin.file:
    path: /tmp/.ansible-komodo/tmp
    state: directory
    owner: komodo
    mode: '0700'

- name: Download Komodo periphery setup script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/moghtech/komodo/main/scripts/setup-periphery.py
    dest: /tmp/setup-periphery.py
    mode: '0755'

- name: Install Komodo periphery as komodo user
  ansible.builtin.command:
    cmd: >-
      python3 /tmp/setup-periphery.py --user
      --core-address="{{ komodo_core_address }}"
      --connect-as="{{ komodo_connect_as }}"
      {{ ('--onboarding-key="' ~ komodo_onboarding_key ~ '"') if komodo_onboarding_key else '' }}
      {{ ('--core-public-keys="' ~ komodo_core_public_key ~ '"') if komodo_core_public_key else '' }}
    creates: /home/komodo/.config/komodo/periphery.config.toml
  become: true
  become_user: komodo
  environment:
    HOME: /home/komodo
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd['komodo'][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd['komodo'][1] }}/bus"
  no_log: true

- name: Configure Komodo root directory
  ansible.builtin.lineinfile:
    path: /home/komodo/.config/komodo/periphery.config.toml
    regexp: '^root_directory'
    line: "root_directory = \"{{ komodo_root_directory }}\""
  become: true
  become_user: komodo

# setup-periphery.py only writes periphery.config.toml the first time it
# runs (it early-returns if the file already exists, and the "creates:"
# guard above skips even invoking it after that) - so core_address,
# connect_as, core_public_keys, and especially onboarding_key can never be
# updated by re-running the installer once cloud-init's first (keyless)
# pass has already created the file. Write them here instead, every run,
# the same way root_directory already is above - this is what actually
# lets a later "give it an onboarding key" re-run take effect.
- name: Configure Komodo core address
  ansible.builtin.lineinfile:
    path: /home/komodo/.config/komodo/periphery.config.toml
    regexp: '^#?\s*core_address\s*='
    line: "core_address = \"{{ komodo_core_address }}\""
  become: true
  become_user: komodo

- name: Configure Komodo connect_as
  ansible.builtin.lineinfile:
    path: /home/komodo/.config/komodo/periphery.config.toml
    regexp: '^#?\s*connect_as\s*='
    line: "connect_as = \"{{ komodo_connect_as }}\""
  become: true
  become_user: komodo

- name: Configure Komodo core public key
  ansible.builtin.lineinfile:
    path: /home/komodo/.config/komodo/periphery.config.toml
    regexp: '^#?\s*core_public_keys\s*='
    line: "core_public_keys = \"{{ komodo_core_public_key }}\""
  become: true
  become_user: komodo
  when: komodo_core_public_key | length > 0

# Only touched when a fresh onboarding key is actually passed in on this
# run (e.g. docs/ci01-bootstrap.md step 5) - leaves an already-onboarded
# host's config alone otherwise, matching the installer's own
# "not needed if connecting as Server that already exists" note.
- name: Configure Komodo onboarding key
  ansible.builtin.lineinfile:
    path: /home/komodo/.config/komodo/periphery.config.toml
    regexp: '^#?\s*onboarding_key\s*='
    line: "onboarding_key = \"{{ komodo_onboarding_key }}\""
  become: true
  become_user: komodo
  when: komodo_onboarding_key | length > 0
  no_log: true

- name: Enable Komodo periphery user service
  ansible.builtin.systemd:
    name: periphery.service
    enabled: true
    state: restarted
    scope: user
  become: true
  become_user: komodo
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd['komodo'][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd['komodo'][1] }}/bus"

# No UFW rule needed: Periphery runs in outbound mode (dials out to Core),
# so there's no inbound port on this host for Komodo at all.
