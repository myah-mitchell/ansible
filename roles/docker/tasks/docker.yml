---
- name: Find the Docker root and persistent disks
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ docker_root_device }}"
    - "{{ docker_persist_device }}"
  register: docker_disks

- name: Stop if a disk is missing
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item }} does not exist. The VM needs scsi1 from the template and
      a scsi2 added with qm set, as provision-a-vm.md in docker-stacks
      describes. If both are attached, list /dev/disk/by-id and set
      docker_root_device and docker_persist_device to match.
    quiet: true
  loop: "{{ docker_disks.results }}"
  loop_control:
    label: "{{ item.item }}"

# The filesystem module leaves a disk that already has a filesystem alone, and
# refuses to replace one of a different type, so a disk moved in from another
# VM keeps its data.
- name: Create an ext4 filesystem on the Docker root disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ docker_root_device }}"
    opts: "-L {{ docker_root_label }}"

- name: Mount the Docker root filesystem
  ansible.posix.mount:
    path: /var/lib/docker
    src: "LABEL={{ docker_root_label }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

- name: Create an ext4 filesystem on the persistent disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ docker_persist_device }}"
    opts: "-L {{ docker_persist_label }}"

- name: Mount the persistent filesystem
  ansible.posix.mount:
    path: "{{ docker_persist_mount }}"
    src: "LABEL={{ docker_persist_label }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

# Only reached once the mount above has succeeded, so these are created on the
# disk and never under the empty mount point.
- name: Create the folders on the persistent disk
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ docker_persist_mount }}/volumes", mode: '0755' }
    - { path: "{{ docker_persist_mount }}/logs", mode: '0755' }
    - { path: "{{ docker_persist_mount }}/host", mode: '0755' }
    - { path: "{{ docker_persist_mount }}/host/ssh", mode: '0700' }

# Bind mounts rather than symlinks, so Docker, Komodo, and the stacks role all
# see an ordinary folder at the path they already use.
- name: Bind the volumes and logs folders to where the stacks expect them
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ docker_persist_mount }}/{{ item.folder }}"
    fstype: none
    opts: bind,nofail
    state: mounted
  loop:
    - { path: "{{ docker_volumes_mount }}", folder: volumes }
    - { path: "{{ docker_logs_mount }}", folder: logs }
  loop_control:
    label: "{{ item.path }}"

- name: Create Docker systemd drop-in folder
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

# nofail keeps a missing disk from stopping the boot, so the host stays
# reachable over SSH. Without this drop-in, Docker would start anyway and write
# every container's data to the root disk under the empty mount point.
- name: Keep Docker from starting without its disks
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/require-disks.conf
    owner: root
    mode: '0644'
    content: |
      [Unit]
      RequiresMountsFor=/var/lib/docker {{ docker_persist_mount }} {{ docker_volumes_mount }} {{ docker_logs_mount }}
  notify: reload systemd

- name: Apply the drop-in before Docker is installed
  ansible.builtin.meta: flush_handlers

# The host's SSH identity lives on the persistent disk, so a rebuilt VM answers
# to the same host keys and nobody's known_hosts complains. Saved keys win when
# they exist. Otherwise the ones cloud-init generated are saved. sshd itself is
# left reading /etc/ssh, so a detached disk can never stop SSH from starting.
- name: Look for saved SSH host keys
  ansible.builtin.find:
    paths: "{{ docker_persist_mount }}/host/ssh"
    patterns: 'ssh_host_*'
  register: docker_saved_ssh_keys

- name: Restore the saved SSH host keys
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/etc/ssh/{{ item.path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: "{{ '0644' if item.path.endswith('.pub') else '0600' }}"
  loop: "{{ docker_saved_ssh_keys.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: restart ssh for host keys
  when: docker_saved_ssh_keys.matched > 0

- name: Find this host's own SSH host keys
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: 'ssh_host_*'
  register: docker_own_ssh_keys
  when: docker_saved_ssh_keys.matched == 0

- name: Save this host's SSH host keys
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ docker_persist_mount }}/host/ssh/{{ item.path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: "{{ '0644' if item.path.endswith('.pub') else '0600' }}"
  loop: "{{ docker_own_ssh_keys.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: docker_saved_ssh_keys.matched == 0

- name: Install aptitude
  ansible.builtin.apt:
    name: aptitude
    state: latest
    update_cache: false
  retries: 3
  delay: 5

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
      - lsb-release
      - python3-pip
      - virtualenv
      - python3-setuptools
      - uidmap
    state: latest
    update_cache: false
  retries: 3
  delay: 5

- name: Create Docker folder
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Create Docker daemon file
  copy:
    dest: "/etc/docker/daemon.json"
    owner: root
    content: |
      {
        "default-address-pools":
        [
          {"base":"10.10.0.0/16","size":28}
        ],
        "icc": false,
        "userns-remap": "default",
        "userland-proxy": false,
        "no-new-privileges": true,
        "live-restore": true,
        "log-level": "info",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "20m",
          "max-file": "5",
          "compress": "true"
        }
      }
  notify: restart docker

- name: Remove Legacy Docker apt Repository
  # ansible.builtin.apt_repository, with no explicit `filename:`, auto-names
  # the file from the repo url - for this repo string that's always
  # download_docker_com_linux_ubuntu.list, regardless of ubuntu_release.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    state: absent

- name: Remove Legacy Docker apt Keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent

- name: Add Docker Repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ubuntu_release }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install docker-ce
  ansible.builtin.apt:
    name: docker-ce
    state: latest
    # deb822_repository (unlike apt_repository) never refreshes the apt
    # cache itself, so this must update it to pick up the repo just added.
    update_cache: true
  retries: 3
  delay: 5

- name: Install docker compose
  ansible.builtin.apt:
    name: docker-compose-plugin
    state: latest
    update_cache: false
  retries: 3
  delay: 5

- name: Install Docker Module for Python
  ansible.builtin.apt:
    name: python3-docker
    state: latest
    update_cache: false
  retries: 3
  delay: 5

- name: Enable Docker content trust
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^DOCKER_CONTENT_TRUST='
    line: DOCKER_CONTENT_TRUST=1
  notify: restart docker

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.forwarding
    value: '1'
    state: present

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Check for the {{ docker_proxy_network }} Docker network
  ansible.builtin.command: docker network inspect {{ docker_proxy_network }}
  register: docker_proxy_network_inspect
  changed_when: false
  failed_when: false

- name: Create the {{ docker_proxy_network }} Docker network
  ansible.builtin.command: docker network create {{ docker_proxy_network }}
  when: docker_proxy_network_inspect.rc != 0

- name: Add Docker group to {{ admin_name }} user
  ansible.builtin.user:
    name: '{{ admin_name }}'
    groups: docker
    append: true

- name: Add Docker group to {{ client_account }} user
  ansible.builtin.user:
    name: '{{ client_account }}'
    groups: docker
    append: true
  when: 
    - users_client_setup|bool